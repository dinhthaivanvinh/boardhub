# Local dev services (docs/03-architecture.md §7). Not needed until M2.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: boardhub
      POSTGRES_PASSWORD: boardhub
      POSTGRES_DB: boardhub
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - '6379:6379'

volumes:
  pgdata:
